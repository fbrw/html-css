    <h1>Teste de Formulário</h1>
    
        <form action="cadastro.php" method="post" autocomplete="off">
            <p>
                <label for="iuser">Usuário:</label> 
                <input type="text" name="user" id="iuser" required minlength="5" maxlength="15" placeholder="Apelido" size="10">
            </p>

           <p>
                <label for="isenha">Senha</label> 
                <input type="password" name="senha" id="isenha" required minlength="8" maxlength="10" placeholder=" Min. 8 Digitos" size="10">
            </p>

           <p>
            <input type="submit" value="Entrar">
            <input type="reset" value="Limpar">
        </p>
        </form>
