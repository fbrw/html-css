<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="cadastro.php" method="post">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="iname" autocomplete="name" required >
        </p>

        <p>
            <label for="imedia">Média:</label>
            <input type="number" name="media" id="imedia" max="10" step="0.1">

        <p>
            <label for="imes">Data:</label>
            <input type="month" name="mes" id="imes">

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
    
</body>
